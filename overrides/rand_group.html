
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球随机分组与队长选拔工具</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --male-color: #3498db;
            --female-color: #e91e63;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        /* 顶部 TABS */
        .tabs {
            display: flex;
            gap: 5px;
            background: #eef2f7;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        button.tab {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            color: #6b7a8d;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.tab:hover {
            background: rgba(255,255,255,0.6);
            color: #2c3e50;
        }

        button.tab.active {
            background: #fff;
            color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .mode-hint {
            text-align: center;
            font-size: 0.82rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
            font-family: monospace;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        button.reset {
            background-color: #95a5a6;
        }

        button.reset:hover {
            background-color: #7f8c8d;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* 解析预览区域样式 */
        .parse-preview {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            display: none;
        }

        .parse-preview.active {
            display: block;
        }

        .parse-preview h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .person-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px dashed #eee;
            gap: 10px;
        }

        .person-row:last-child {
            border-bottom: none;
        }

        .person-row .name {
            flex: 1;
            font-size: 14px;
        }

        .person-row .gender-radio-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .person-row .gender-radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 3px;
        }

        .person-row .gender-label {
            font-weight: bold;
        }

        .person-row .gender-label.male { color: var(--male-color); }
        .person-row .gender-label.female { color: var(--female-color); }

        .fixed-tag {
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }
        .fixed-tag.male { background-color: var(--male-color); }
        .fixed-tag.female { background-color: var(--female-color); }

        .preview-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .preview-actions button {
            padding: 8px 15px;
            font-size: 14px;
        }

        .result-area {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .group-card {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .group-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #f0f0f0;
            color: #2c3e50;
        }

        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .tag {
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-left: 5px;
        }

        .tag.male { background-color: var(--male-color); }
        .tag.female { background-color: var(--female-color); }

        .captain-badge {
            background-color: #f1c40f;
            color: #d35400;
            font-size: 0.75rem;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: bold;
            border: 1px solid #f39c12;
        }

        .stats {
            text-align: center;
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: #fdf2f2;
            border-radius: 8px;
        }

        .info-msg {
            color: #27ae60;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .step-indicator {
            text-align: center;
            font-size: 0.85rem;
            color: #95a5a6;
            margin-bottom: 10px;
        }

        .result-toolbar {
            display: none;
            gap: 10px;
            margin-top: 20px;
        }

        .result-toolbar.show {
            display: flex;
        }

        .result-toolbar button {
            padding: 10px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .result-area { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .preview-actions { flex-direction: column; }
            .result-toolbar { flex-direction: column; }
            .tabs { flex-wrap: wrap; }
            button.tab { flex: 1 1 30%; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>羽毛球随机分组 & 队长选拔</h1>

    <!-- 模式 TABS -->
    <div class="tabs" id="modeTabs">
        <button class="tab" data-mode="ms">男单</button>
        <button class="tab" data-mode="ws">女单</button>
        <button class="tab" data-mode="md">男双</button>
        <button class="tab" data-mode="wd">女双</button>
        <button class="tab active" data-mode="xd">混双</button>
    </div>
    <div class="mode-hint" id="modeHint"></div>

    <div class="step-indicator" id="stepIndicator">步骤1：粘贴名单并解析</div>

    <div class="input-group">
        <label for="names">选手名单（支持格式：序号. 姓名 /性别）</label>
        <textarea id="names" placeholder="例如：
1. 江湖中。。张洁 /男
2. 阿民 /男
3. L。F /女
4. Anna /女
5. 张三"></textarea>
    </div>

    <div class="btn-group">
        <button onclick="parseNamesPreview()" id="parseBtn">解析名单</button>
        <button class="reset" onclick="clearAll()">重新粘贴</button>
    </div>

    <!-- 解析预览区域 -->
    <div class="parse-preview" id="parsePreview">
        <h3 id="previewTitle">已解析人员名单</h3>
        <div id="personList"></div>
        <div class="preview-actions">
            <button onclick="confirmNames()" id="confirmBtn">确定，开始分组</button>
            <button class="reset" onclick="cancelParse()" style="padding: 8px 15px; font-size: 14px;">取消</button>
        </div>
    </div>

    <div class="input-group" id="groupCountGroup" style="display:none;">
        <label for="groupCount">设置分组数量</label>
        <input type="number" id="groupCount" value="4" min="1">
    </div>

    <div class="btn-group" id="actionBtnGroup" style="display:none;">
        <button onclick="startGrouping()" id="groupBtn">开始随机分组</button>
        <button class="reset" onclick="clearAll()">清空重置</button>
    </div>

    <div id="info" class="info-msg"></div>
    <div id="error" class="error-msg"></div>

    <div class="result-toolbar" id="resultToolbar">
        <button onclick="startGrouping()">重新抽取</button>
        <button class="reset" onclick="copyResult()">复制结果</button>
    </div>

    <div id="result" class="result-area"></div>
</div>

<script>
    /* ---------- 模式配置 ---------- */
    const MODES = {
        ms: { label: '男单', fixedGender: 'male',   parseGender: false, hint: '男单模式：名单不做性别解析，全部按男生处理，每组首位自动担任队长' },
        ws: { label: '女单', fixedGender: 'female', parseGender: false, hint: '女单模式：名单不做性别解析，全部按女生处理，每组首位自动担任队长' },
        md: { label: '男双', fixedGender: 'male',   parseGender: false, hint: '男双模式：名单不做性别解析，全部按男生处理，每组首位自动担任队长' },
        wd: { label: '女双', fixedGender: 'female', parseGender: false, hint: '女双模式：名单不做性别解析，全部按女生处理，每组首位自动担任队长' },
        xd: { label: '混双', fixedGender: null,     parseGender: true,  hint: '混双模式：按 /男 /女（或 M/F）识别性别，男女分池抽取，保证每组女生数量尽可能相等，每组首位自动担任队长' }
    };

    let currentMode = 'xd';
    let parsedPersons = [];   // 已确认的名单
    let lastResult = [];      // 最近一次分组结果，用于复制

    /* ---------- 工具函数 ---------- */
    // Fisher-Yates 洗牌
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showError(msg) {
        const el = document.getElementById('error');
        el.innerText = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error').style.display = 'none';
    }

    /* ---------- TABS 切换 ---------- */
    document.querySelectorAll('#modeTabs .tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#modeTabs .tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            resetForMode();
        });
    });

    function applyModeText() {
        const m = MODES[currentMode];
        document.getElementById('modeHint').innerText = m.hint;
        const ta = document.getElementById('names');
        ta.placeholder = m.parseGender
            ? '例如：\n1. 江湖中。。张洁 /男\n2. 阿民 /男\n3. L。F /女\n4. Anna /女\n5. 张三（未标注默认男生）'
            : '例如：\n1. 江湖中。。张洁\n2. 阿民\n3. 王光政\n（当前模式不做性别解析，末尾的 /男 /女 会被自动忽略）';
        document.getElementById('previewTitle').innerText = m.parseGender ? '已解析人员名单（可手动调整性别）' : '已解析人员名单';
    }

    // 切换模式后重置解析状态（保留已粘贴文本）
    function resetForMode() {
        applyModeText();
        parsedPersons = [];
        lastResult = [];
        document.getElementById('result').innerHTML = '';
        document.getElementById('resultToolbar').classList.remove('show');
        document.getElementById('parsePreview').classList.remove('active');
        document.getElementById('groupCountGroup').style.display = 'none';
        document.getElementById('actionBtnGroup').style.display = 'none';
        document.getElementById('info').innerText = '';
        hideError();
        document.getElementById('parseBtn').disabled = false;
        document.getElementById('stepIndicator').innerText = '步骤1：粘贴名单并解析';
    }

    /* ---------- 名单解析 ---------- */
    function parseNames(text) {
        const mode = MODES[currentMode];
        const lines = text.split('\n');
        const persons = [];

        lines.forEach(line => {
            let raw = line.trim();
            if (!raw) return;

            // 去掉行首序号：1. / 1、/ 1) / 1： / 1 空格
            raw = raw.replace(/^\s*\d+\s*[.、．)）:：]\s*/, '').trim();
            if (!raw) return;

            let gender = null;
            if (mode.parseGender) {
                // 识别行尾性别标记：/男、 女、／F、,m 等（要求前面有分隔符，避免误伤 "L。F"、"Tom"）
                const gm = raw.match(/[\s/／、|｜,，]+([男女MFmf])\s*$/);
                if (gm) {
                    gender = (gm[1] === '女' || gm[1].toLowerCase() === 'f') ? 'female' : 'male';
                    raw = raw.replace(/[\s/／、|｜,，]+[男女MFmf]\s*$/, '').trim();
                }
            } else {
                // 非混双模式不做性别解析，但把行尾的性别标记直接丢掉
                raw = raw.replace(/[\s/／、|｜,，]+[男女MFmf]\s*$/, '').trim();
            }

            if (!raw) return;
            persons.push({ name: raw, gender: gender || mode.fixedGender || 'male' });
        });

        return persons;
    }

    /* ---------- 预览 ---------- */
    function parseNamesPreview() {
        hideError();
        const text = document.getElementById('names').value;
        const mode = MODES[currentMode];

        if (!text.trim()) {
            showError('请先粘贴选手名单！');
            return;
        }

        parsedPersons = parseNames(text);
        if (parsedPersons.length === 0) {
            showError('未识别到有效名单，请检查格式（示例：1. 张三 /男 或直接写 张三）');
            return;
        }

        const maleCount = parsedPersons.filter(p => p.gender === 'male').length;
        const femaleCount = parsedPersons.length - maleCount;

        // 男单/女单/男双/女双：不做性别解析，跳过确认界面，直接进入分组设置
        if (!mode.parseGender) {
            document.getElementById('parsePreview').classList.remove('active');
            document.getElementById('groupCountGroup').style.display = 'block';
            document.getElementById('actionBtnGroup').style.display = 'flex';
            document.getElementById('parseBtn').disabled = true;
            document.getElementById('stepIndicator').innerText =
                `已解析 ${parsedPersons.length} 人（全部按${mode.fixedGender === 'male' ? '男生' : '女生'}处理），设置组数后点击"开始随机分组"`;
            document.getElementById('info').innerText = `共 ${parsedPersons.length} 人，无需选择性别，直接分组即可`;
            document.getElementById('groupCount').scrollIntoView({ behavior: 'smooth' });
            return;
        }

        let html = '';
        parsedPersons.forEach((person, index) => {
            const isMale = person.gender === 'male';
            let right;
            if (mode.parseGender) {
                right = `
                    <div class="gender-radio-group">
                        <label style="font-size:13px; cursor:pointer;">
                            <input type="radio" name="gender_${index}" value="male" ${isMale ? 'checked' : ''} onchange="setGender(${index}, 'male')">
                            <span class="gender-label male">男</span>
                        </label>
                        <label style="font-size:13px; cursor:pointer;">
                            <input type="radio" name="gender_${index}" value="female" ${!isMale ? 'checked' : ''} onchange="setGender(${index}, 'female')">
                            <span class="gender-label female">女</span>
                        </label>
                    </div>`;
            } else {
                right = `<span class="fixed-tag ${person.gender}">${isMale ? '男' : '女'}</span>`;
            }

            html += `
                <div class="person-row">
                    <span style="color:#95a5a6; font-size:13px;">${index + 1}.</span>
                    <span class="name">${escapeHtml(person.name)}</span>
                    ${right}
                </div>`;
        });

        document.getElementById('personList').innerHTML = html;
        document.getElementById('parsePreview').classList.add('active');
        document.getElementById('groupCountGroup').style.display = 'block';
        document.getElementById('actionBtnGroup').style.display = 'flex';

        const total = parsedPersons.length;
        const countText = mode.parseGender
            ? `共 ${total} 人（男 ${maleCount} 人，女 ${femaleCount} 人）`
            : `共 ${total} 人（全部按${mode.fixedGender === 'male' ? '男生' : '女生'}处理）`;

        document.getElementById('stepIndicator').innerText =
            `步骤2：确认名单（${countText}）→ 设置组数 → 随机分组`;
        document.getElementById('info').innerText =
            mode.parseGender ? `已解析 ${countText}，请确认性别后点击"确定，开始分组"` : `已解析 ${countText}，点击"确定，开始分组"`;
    }

    function setGender(index, gender) {
        parsedPersons[index].gender = gender;
    }

    function confirmNames() {
        document.getElementById('parsePreview').classList.remove('active');
        document.getElementById('parseBtn').disabled = true;
        document.getElementById('stepIndicator').innerText = '已确认名单，可调整分组数量后点击"开始随机分组"';
        document.getElementById('groupCount').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelParse() {
        resetForMode();
    }

    /* ---------- 随机分组（不放回抽取） ---------- */
    function startGrouping() {
        const resultDiv = document.getElementById('result');
        const infoDiv = document.getElementById('info');
        hideError();
        resultDiv.innerHTML = '';
        infoDiv.innerText = '';

        const groupCount = parseInt(document.getElementById('groupCount').value);
        const mode = MODES[currentMode];

        if (parsedPersons.length === 0) {
            showError('请先解析并确认名单！');
            return;
        }
        if (isNaN(groupCount) || groupCount < 1) {
            showError('请输入有效的分组数量！');
            return;
        }
        if (groupCount > parsedPersons.length) {
            showError('分组数量不能超过人数！');
            return;
        }

        const groups = Array.from({ length: groupCount }, () => []);

        if (mode.parseGender) {
            // 混双：男女分池，各自洗牌后轮流抽取（不放回）
            const males = shuffle(parsedPersons.filter(p => p.gender === 'male'));
            const females = shuffle(parsedPersons.filter(p => p.gender === 'female'));

            if (females.length === 0) {
                showError('混双模式需要至少 1 名女生，请在名单中标注性别（如：张三 /女）');
                return;
            }
            if (males.length === 0) {
                showError('混双模式需要至少 1 名男生！');
                return;
            }

            // 先抽女生：轮询分配，保证每组女生数量尽可能相等（最多相差 1 人）
            let gi = 0;
            while (females.length) {
                groups[gi % groupCount].push(females.shift()); // shift = 不放回
                gi++;
            }
            // 再抽男生：同样轮询分配，保证每组人数尽可能均衡
            gi = 0;
            while (males.length) {
                groups[gi % groupCount].push(males.shift());
                gi++;
            }

        } else {
            // 男单/女单/男双/女双：单一池子洗牌后轮流抽取（不放回）
            const pool = shuffle(parsedPersons.slice());
            let gi = 0;
            while (pool.length) {
                groups[gi % groupCount].push(pool.shift());
                gi++;
            }
        }

        renderGroups(groups, mode);
        lastResult = groups;
        document.getElementById('resultToolbar').classList.add('show');
        document.getElementById('stepIndicator').innerText = '分组完成！';

        const femaleTotal = parsedPersons.filter(p => p.gender === 'female').length;
        const maleTotal = parsedPersons.length - femaleTotal;
        let summary = `已分为 ${groupCount} 组（男 ${maleTotal} 人，女 ${femaleTotal} 人），抽取方式为不放回随机`;
        if (mode.parseGender) {
            const perGroupFemale = groups.map(g => g.filter(p => p.gender === 'female').length);
            summary += `，各组女生人数：${perGroupFemale.join(' / ')}`;
            if (groupCount > femaleTotal) summary += '（女生人数少于组数，部分组将没有女生）';
        }
        summary += '，每组首位自动担任队长';
        infoDiv.innerText = summary;
    }

    function renderGroups(groups, mode) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '';

        groups.forEach((group, index) => {
            const card = document.createElement('div');
            card.className = 'group-card';

            const mCount = group.filter(p => p.gender === 'male').length;
            const fCount = group.length - mCount;

            let html = `<div class="group-title">第 ${index + 1} 组（${group.length} 人）</div><ul class="member-list">`;

            group.forEach((member, i) => {
                const badge = (i === 0) ? '<span class="captain-badge">队长</span>' : '';
                const genderText = member.gender === 'male' ? '男' : '女';
                html += `
                    <li class="member-item">
                        <span class="name">${escapeHtml(member.name)}${badge}</span>
                        <span class="tag ${member.gender}">${genderText}</span>
                    </li>`;
            });

            html += '</ul>';
            html += mode.parseGender
                ? `<div class="stats">男 ${mCount} 人 · 女 ${fCount} 人${group.length ? ` · 队长：${escapeHtml(group[0].name)}` : ''}</div>`
                : `<div class="stats">${group.length ? `队长：${escapeHtml(group[0].name)} · 共 ${group.length} 人` : `共 ${group.length} 人`}</div>`;

            card.innerHTML = html;
            resultDiv.appendChild(card);
        });
    }

    function copyResult() {
        if (!lastResult.length) return;
        const mode = MODES[currentMode];
        let text = `【${mode.label}】随机分组结果\n`;
        lastResult.forEach((group, i) => {
            text += `\n第 ${i + 1} 组（${group.length} 人）：\n`;
            group.forEach((m, j) => {
                const g = m.gender === 'male' ? '男' : '女';
                text += `  ${j + 1}. ${m.name}（${g}）${j === 0 ? ' [队长]' : ''}\n`;
            });
        });
        navigator.clipboard.writeText(text).then(() => {
            document.getElementById('info').innerText = '分组结果已复制到剪贴板';
        }).catch(() => {
            showError('复制失败，请手动选择文本复制');
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function clearAll() {
        document.getElementById('names').value = '';
        resetForMode();
    }

    // 初始化
    applyModeText();

    // 名单内容变化后允许重新解析
    document.getElementById('names').addEventListener('input', () => {
        document.getElementById('parseBtn').disabled = false;
    });
</script>

</body>
</html>
